[workspace]
resolver = "3"
members = [
    "apps/pikr",
    "xtask",
]
default-members = ["apps/pikr"]

[workspace.package]
version = "0.9.2"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/kryptic-sh/pikr"
homepage = "https://github.com/kryptic-sh/pikr"
authors = ["mxaddict <mxaddict@kryptic.sh>"]

[workspace.dependencies]
anyhow = "1"
# The GUI: crcbl's window shell, GPU layer, UI tree and draw pass, its
# image decoders and icon-theme lookup, system font lookup, and (crcbl-app)
# the presenter, which opens the platform's GPU backend (Vulkan, D3D12 or
# Metal), chooses the adapter and paces presents. Every crcbl crate must
# name the same version.
crcbl-app = "0.9.0"
crcbl-frame = { version = "0.9.0", features = ["parsed-font"] }
crcbl-hal = "0.9.0"
crcbl-image = { version = "0.9.0", features = ["png", "jpeg", "svg", "webp", "ico", "xpm", "svg-text", "theme"] }
crcbl-shell = "0.9.0"
crcbl-ui = { version = "0.9.0", features = ["system-fonts"] }
# crcbl-ui and crcbl-frame take glam vectors and do not re-export glam.
glam = "0.34"
clap = { version = "4", features = ["derive"] }
dirs = "7"
emojis = "0.9"
# Held at 11: evalexpr 12.0.0 relicensed under AGPL-3.0-only, which pikr's
# MIT binaries cannot ship (cargo-deny rejects it).
evalexpr = "11"
freedesktop-desktop-entry = "0.8"
nucleo = "0.5"
serde = { version = "1", features = ["derive"] }
shlex = "2"
toml = "1.1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
xdg = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
