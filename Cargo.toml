[workspace]
resolver = "3"
members = [
    "apps/pikr",
    "xtask",
]
default-members = ["apps/pikr"]

[workspace.package]
version = "0.8.9"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kryptic-sh/pikr"
homepage = "https://github.com/kryptic-sh/pikr"
authors = ["mxaddict <mxaddict@kryptic.sh>"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
emojis = "0.6"
# Persistent Vector for floem's virtual_stack VirtualVector impl. O(1) clone.
imbl = "7.0"
evalexpr = "11"
floem = "0.2"
freedesktop-desktop-entry = "0.7"
freedesktop-icons = "0.4"
# CSS parser used for pikr's stylesheet driving floem's view styling.
# `hjkl-css-gui` is intentionally skipped: it's built against floem 0.2.0
# stable and breaks under pikr's `[patch.crates-io]` redirect to current
# `lapce/floem` main. Pikr ships its own thin floem-Style adapter against
# the parsed `Stylesheet` for the small subset of CSS properties used here.
hjkl-css = "0.25"
# resvg + tiny-skia for server-side SVG rasterisation (icon-only). Floem's
# `svg` view goes through vello which silently drops unsupported features
# (markers, complex clip-paths) and renders the icon's black background
# plate alone. Rasterising once with resvg → PNG and feeding through
# `img()` produces a correct bitmap. resvg is already in the workspace
# transitively via floem; promoting to a direct dep costs no build time.
resvg = "0.43"
nucleo = "0.5"
serde = { version = "1", features = ["derive"] }
shlex = "1"
toml = "0.8"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
xdg = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Epic 4 — Wayland layer-shell support. The fork branches that previously
# carried the layer-shell work (`layer-shell-port` on both forks plus
# `feat/menus-feature` on floem, the upstream lapce/floem#1077 PR branch)
# have been merged into each fork's default branch — winit's `master`,
# floem's `main`. Drop these patches once layer-shell + the `menus` feature
# land upstream and crates.io ships them.
[patch.crates-io]
floem       = { git = "https://github.com/mxaddict/floem.git", branch = "main" }
floem-winit = { git = "https://github.com/mxaddict/winit.git", branch = "master", package = "floem-winit" }
