[workspace]
resolver = "3"
members = [
    "apps/pikr",
    "xtask",
]
default-members = ["apps/pikr"]

[workspace.package]
version = "0.8.13"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/kryptic-sh/pikr"
homepage = "https://github.com/kryptic-sh/pikr"
authors = ["mxaddict <mxaddict@kryptic.sh>"]

[workspace.dependencies]
anyhow = "1"
# The GUI: crcbl's window shell, GPU layer, UI tree and draw pass, and its
# image decoders and icon-theme lookup. Pinned to a CI-green crcbl main
# commit until a crcbl release carries crcbl-image (0.1.0 does not); bump
# the rev as crcbl lands the features pikr is waiting on (see
# docs/backlog.md). Every crcbl crate must name the same rev.
crcbl-dx12 = { git = "https://github.com/kryptic-sh/crcbl", rev = "de5f5aded5eb0e8d0d945661c4d2a0b5abd099cd", version = "0.1.0" }
crcbl-frame = { git = "https://github.com/kryptic-sh/crcbl", rev = "de5f5aded5eb0e8d0d945661c4d2a0b5abd099cd", version = "0.1.0", features = ["parsed-font"] }
crcbl-hal = { git = "https://github.com/kryptic-sh/crcbl", rev = "de5f5aded5eb0e8d0d945661c4d2a0b5abd099cd", version = "0.1.0" }
crcbl-image = { git = "https://github.com/kryptic-sh/crcbl", rev = "de5f5aded5eb0e8d0d945661c4d2a0b5abd099cd", version = "0.1.0", features = ["png", "jpeg", "svg", "webp", "ico", "theme"] }
crcbl-mtl = { git = "https://github.com/kryptic-sh/crcbl", rev = "de5f5aded5eb0e8d0d945661c4d2a0b5abd099cd", version = "0.1.0" }
crcbl-shell = { git = "https://github.com/kryptic-sh/crcbl", rev = "de5f5aded5eb0e8d0d945661c4d2a0b5abd099cd", version = "0.1.0" }
crcbl-ui = { git = "https://github.com/kryptic-sh/crcbl", rev = "de5f5aded5eb0e8d0d945661c4d2a0b5abd099cd", version = "0.1.0", features = ["parsed-font"] }
crcbl-vk = { git = "https://github.com/kryptic-sh/crcbl", rev = "de5f5aded5eb0e8d0d945661c4d2a0b5abd099cd", version = "0.1.0" }
# crcbl-ui and crcbl-frame take glam vectors and do not re-export glam.
glam = "0.34"
clap = { version = "4", features = ["derive"] }
dirs = "6"
emojis = "0.9"
evalexpr = "11"
freedesktop-desktop-entry = "0.8"
nucleo = "0.5"
serde = { version = "1", features = ["derive"] }
shlex = "2"
toml = "1.1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
xdg = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
