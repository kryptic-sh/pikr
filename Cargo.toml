[workspace]
resolver = "3"
members = [
    "apps/pikr",
    "xtask",
]
default-members = ["apps/pikr"]

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/kryptic-sh/pikr"
homepage = "https://github.com/kryptic-sh/pikr"
authors = ["mxaddict <mxaddict@kryptic.sh>"]

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
emojis = "0.6"
# Persistent Vector for floem's virtual_stack VirtualVector impl. O(1) clone.
imbl = "7.0"
evalexpr = "11"
floem = "0.2"
freedesktop-desktop-entry = "0.7"
freedesktop-icons = "0.4"
# resvg + tiny-skia for server-side SVG rasterisation (icon-only). Floem's
# `svg` view goes through vello which silently drops unsupported features
# (markers, complex clip-paths) and renders the icon's black background
# plate alone. Rasterising once with resvg → PNG and feeding through
# `img()` produces a correct bitmap. resvg is already in the workspace
# transitively via floem; promoting to a direct dep costs no build time.
resvg = "0.43"
nucleo = "0.5"
serde = { version = "1", features = ["derive"] }
shlex = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xdg = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Epic 4 — Wayland layer-shell support. New port branches sit on top of
# current lapce/{floem,winit} main (not the old 0.2.0 / 0.29.5 snapshots).
# Drop these patches once layer-shell lands upstream.
[patch.crates-io]
floem       = { git = "https://github.com/mxaddict/floem.git", branch = "layer-shell-port" }
floem-winit = { git = "https://github.com/mxaddict/winit.git", branch = "layer-shell-port", package = "floem-winit" }
