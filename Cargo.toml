[workspace]
resolver = "3"
members = [
    "apps/pikr",
    "xtask",
]
default-members = ["apps/pikr"]

[workspace.package]
version = "0.8.13"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/kryptic-sh/pikr"
homepage = "https://github.com/kryptic-sh/pikr"
authors = ["mxaddict <mxaddict@kryptic.sh>"]

[workspace.dependencies]
anyhow = "1"
# The GUI: crcbl's window shell, GPU layer, UI tree and draw pass, and its
# image decoders and icon-theme lookup. Every crcbl crate must name the
# same version.
crcbl-dx12 = "0.2"
crcbl-frame = { version = "0.2", features = ["parsed-font"] }
crcbl-hal = "0.2"
crcbl-image = { version = "0.2", features = ["png", "jpeg", "svg", "webp", "ico", "xpm", "theme"] }
crcbl-mtl = "0.2"
crcbl-shell = "0.2"
crcbl-ui = { version = "0.2", features = ["parsed-font"] }
crcbl-vk = "0.2"
# crcbl-ui and crcbl-frame take glam vectors and do not re-export glam.
glam = "0.34"
clap = { version = "4", features = ["derive"] }
dirs = "6"
emojis = "0.9"
evalexpr = "11"
freedesktop-desktop-entry = "0.8"
nucleo = "0.5"
serde = { version = "1", features = ["derive"] }
shlex = "2"
toml = "1.1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
xdg = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
