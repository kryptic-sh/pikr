[workspace]
resolver = "3"
members = [
    "apps/pikr",
    "xtask",
]
default-members = ["apps/pikr"]

[workspace.package]
version = "0.8.13"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/kryptic-sh/pikr"
homepage = "https://github.com/kryptic-sh/pikr"
authors = ["mxaddict <mxaddict@kryptic.sh>"]

[workspace.dependencies]
anyhow = "1"
# The GUI: crcbl's window shell, GPU layer, UI tree and draw pass, its
# image decoders and icon-theme lookup, and system font lookup. Pinned to a
# CI-green crcbl main commit past 0.2.1 for text shaping; move back to the
# crates.io release that carries it. Every crcbl crate must name the same rev.
crcbl-dx12 = { git = "https://github.com/kryptic-sh/crcbl", rev = "3c023b2ff34890168a8085a7c90d561e87fe3077", version = "0.2.1" }
crcbl-frame = { git = "https://github.com/kryptic-sh/crcbl", rev = "3c023b2ff34890168a8085a7c90d561e87fe3077", version = "0.2.1", features = ["parsed-font"] }
crcbl-hal = { git = "https://github.com/kryptic-sh/crcbl", rev = "3c023b2ff34890168a8085a7c90d561e87fe3077", version = "0.2.1" }
crcbl-image = { git = "https://github.com/kryptic-sh/crcbl", rev = "3c023b2ff34890168a8085a7c90d561e87fe3077", version = "0.2.1", features = ["png", "jpeg", "svg", "webp", "ico", "xpm", "svg-text", "theme"] }
crcbl-mtl = { git = "https://github.com/kryptic-sh/crcbl", rev = "3c023b2ff34890168a8085a7c90d561e87fe3077", version = "0.2.1" }
crcbl-shell = { git = "https://github.com/kryptic-sh/crcbl", rev = "3c023b2ff34890168a8085a7c90d561e87fe3077", version = "0.2.1" }
crcbl-ui = { git = "https://github.com/kryptic-sh/crcbl", rev = "3c023b2ff34890168a8085a7c90d561e87fe3077", version = "0.2.1", features = ["system-fonts"] }
crcbl-vk = { git = "https://github.com/kryptic-sh/crcbl", rev = "3c023b2ff34890168a8085a7c90d561e87fe3077", version = "0.2.1" }
# crcbl-ui and crcbl-frame take glam vectors and do not re-export glam.
glam = "0.34"
clap = { version = "4", features = ["derive"] }
dirs = "6"
emojis = "0.9"
evalexpr = "11"
freedesktop-desktop-entry = "0.8"
nucleo = "0.5"
serde = { version = "1", features = ["derive"] }
shlex = "2"
toml = "1.1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
xdg = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
