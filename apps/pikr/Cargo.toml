[package]
name = "pikr"
description = "Vim-modal picker / launcher. Rofi replacement with hjkl keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["launcher", "picker", "rofi", "wayland", "vim"]
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "pikr"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
emojis.workspace = true
evalexpr.workspace = true
floem.workspace = true
hjkl-css.workspace = true
resvg.workspace = true
imbl.workspace = true
nucleo.workspace = true
serde.workspace = true
shlex.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true

# Freedesktop-spec crates (drun, icon theme, XDG base dirs) are
# unix-only. On macOS / Windows the drun mode degrades to an empty
# entry list and config / frecency / history fall back to defaults.
[target.'cfg(unix)'.dependencies]
freedesktop-desktop-entry.workspace = true
freedesktop-icons.workspace = true
xdg.workspace = true

# arboard provides clipboard read/write on Windows (current text only).
# Full clipboard history requires the WinRT ClipboardHistory API (issue #37).
[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false }
lnk = "0.6"      # pure-Rust .lnk parser for drun Start Menu walk (issue #38)
rayon = "1"       # parallel .lnk parse for fast drun cold start (issue #42)
serde_json = "1"  # drun entry cache serialisation (issue #42)
walkdir = "2"     # recursive directory walker for Start Menu trees (issue #38)
# Win32 API bindings for drun icon extraction (issue #40): SHGetFileInfo,
# GetDIBits, DestroyIcon.  Feature set kept narrow — only the UI Shell,
# window messaging, GDI, and foundation types we actually call into.
windows = { version = "0.62", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
] }
# PNG encoding for the rasterised HICON bitmaps.  `image` is already a
# transitive dep via floem; pin explicitly so the Windows icon path can
# reference it without relying on transitive feature unification.
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.11"     # SHA-256 cache-key derivation for icon-cache filenames

[dev-dependencies]
libc = "0.2"
tempfile.workspace = true
