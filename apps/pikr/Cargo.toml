[package]
name = "pikr"
description = "Vim-modal picker / launcher. Rofi replacement with hjkl keys."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "../../README.md"
keywords = ["launcher", "picker", "rofi", "wayland", "vim"]
categories = ["command-line-utilities", "gui"]

[[bin]]
name = "pikr"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
dirs.workspace = true
emojis.workspace = true
evalexpr.workspace = true
floem.workspace = true
hjkl-css.workspace = true
resvg.workspace = true
imbl.workspace = true
nucleo.workspace = true
serde.workspace = true
shlex.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true

# Freedesktop-spec crates (drun, icon theme, XDG base dirs) are
# unix-only. Windows has its own drun collector, and its config and
# state paths come from `dirs` instead of `xdg`.
[target.'cfg(unix)'.dependencies]
freedesktop-desktop-entry.workspace = true
freedesktop-icons.workspace = true
xdg.workspace = true

# arboard provides clipboard read/write on Windows (current text only).
# Full clipboard history requires the WinRT ClipboardHistory API (issue #37).
[target.'cfg(windows)'.dependencies]
arboard = { version = "3", default-features = false }
# Win32 API bindings for drun (issues #38, #40): shell:AppsFolder enumeration
# and launch (SHGetKnownFolderItem, ShellExecuteExW — which needs
# System_Registry for its struct), shell-item icons via GetDIBits, and the
# console re-attach. Feature set kept narrow — only what we call into.
windows = { version = "0.62", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_Registry",
] }
# PNG encoding for the rasterised HICON bitmaps.  `image` is already a
# transitive dep via floem; pin explicitly so the Windows icon path can
# reference it without relying on transitive feature unification.
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.11"     # SHA-256 cache-key derivation for icon-cache filenames

[dev-dependencies]
libc = "0.2"
tempfile.workspace = true
