name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  # mlugg/setup-zig still declares `using: node20` on its latest tag.
  # Opt JS actions into Node 24 now so the deprecation warning goes
  # quiet and we catch any upstream incompatibility early. Drop this
  # once setup-zig migrates to node24 (or June 2026, when GH flips
  # the default).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          cache: false
      - run: rustup update --no-self-update stable
      - run: cargo fmt --all --check

  clippy:
    name: clippy ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pikr is Linux-first, Wayland-only. macOS / Windows clippy is
        # advisory until #8 / #9 (cross-platform desktop support) land —
        # floem's layer-shell fork doesn't build on those targets yet, so
        # `continue-on-error` keeps the matrix informative without
        # blocking PRs. Drop the continue-on-error guard once the fork
        # is portable.
        include:
          - os: ubuntu-latest
            advisory: false
          - os: macos-latest
            advisory: true
          - os: windows-latest
            advisory: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    steps:
      - uses: actions/checkout@v6
      # System deps for transitive gtk-rs / glib-sys build scripts pulled
      # in via current lapce/floem main (jrmoulton/understory). Linux only.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --workspace -- -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  machete:
    name: cargo-machete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: bnjbvr/cargo-machete@main

  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux-first GUI: rofi replacement targets Wayland only. macOS
        # release builds are still produced for the Homebrew tap but
        # exercising them under runtime tests adds little value while
        # gettext-sys / floem display-detection break the matrix. Revisit
        # when macOS / Windows become first-class targets.
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      # See clippy job for rationale on the gtk-rs / glib-sys system deps.
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxkbcommon-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - run: rustup update --no-self-update stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run --workspace --locked --no-fail-fast

  e2e:
    name: e2e keyboard
    runs-on: ubuntu-latest
    # Advisory until the sway-headless harness has shown a few green
    # main-push runs without flake (tracked in #26). Drop
    # `continue-on-error` once stability is proven so a real regression
    # blocks PRs.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y sway wtype libgtk-3-dev libxkbcommon-dev
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache: false
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin pikr --locked
      - run: cargo test --release --test keyboard -- --test-threads=1

  build:
    name: Build ${{ matrix.target }}
    needs: [test]
    # Tag-gated: the cross-platform binary matrix runs only on v*.*.* tag
    # pushes (the release pipeline) or manual workflow_dispatch. Its
    # consumers (aur-bin / alpine / brew-tap) are already tag-gated, so
    # building on every main push wastes the artifacts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zigbuild_target: x86_64-unknown-linux-gnu.2.28
            zig: "true"
            macos_min: ""
            suffix: ""
            archive: tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zigbuild_target: aarch64-unknown-linux-gnu.2.28
            zig: "true"
            macos_min: ""
            suffix: ""
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            zigbuild_target: x86_64-unknown-linux-musl
            zig: "true"
            macos_min: ""
            suffix: ""
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            zigbuild_target: ""
            zig: "false"
            macos_min: "11.0"
            suffix: ""
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            zigbuild_target: ""
            zig: "false"
            macos_min: "10.15"
            suffix: ""
            archive: tar.gz

    steps:
      - uses: actions/checkout@v6

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$CARGO_VER" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version v$CARGO_VER"
            exit 1
          fi

      - name: Install Rust stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          components: clippy, rustfmt
          cache: false
      - run: rustup update --no-self-update stable

      - name: Ensure target std installed
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Setup zig
        if: matrix.zig == 'true'
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.1"

      - name: Install cargo-zigbuild
        if: matrix.zig == 'true'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build binary (zigbuild)
        if: matrix.zig == 'true'
        run: cargo zigbuild --release --locked --target ${{ matrix.zigbuild_target }} --bin pikr

      - name: Build binary (native)
        if: matrix.zig == 'false'
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
        run: cargo build --release --locked --target ${{ matrix.target }} --bin pikr

      - name: Package (Linux / macOS)
        if: matrix.archive == 'tar.gz'
        run: |
          TAG=${GITHUB_REF_NAME}
          ARCHIVE="pikr-${TAG}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp target/${{ matrix.target }}/release/pikr${{ matrix.suffix }} dist/
          cp README.md LICENSE dist/
          tar -czf "$ARCHIVE" -C dist .
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          else
            shasum -a 256 "$ARCHIVE" > "$ARCHIVE.sha256"
          fi

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $TAG = $env:GITHUB_REF_NAME
          $ARCHIVE = "pikr-$TAG-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Force dist
          Copy-Item "target/${{ matrix.target }}/release/pikr${{ matrix.suffix }}" dist/
          Copy-Item README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath $ARCHIVE
          $hash = (Get-FileHash -Algorithm SHA256 $ARCHIVE).Hash.ToLower()
          "$hash  $ARCHIVE" | Out-File -Encoding ASCII "$ARCHIVE.sha256"

      - name: Upload archives + sha256
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pikr-*.${{ matrix.archive }}
            pikr-*.${{ matrix.archive }}.sha256
          fail_on_unmatched_files: true
          generate_release_notes: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # AUR auto-publish for `pikr-bin`. Pulls the just-uploaded tarball
  # checksums off the release, renders pkg/aur/PKGBUILD-bin.in,
  # generates .SRCINFO, and pushes to the AUR repo over SSH. Lives here
  # (not a separate workflow) because GITHUB_TOKEN-created releases don't
  # fire downstream `on: release` triggers; running as a
  # `needs: [build]` job sidesteps the cascade entirely.
  #
  # Required org/repo secret:
  #   AUR_SSH_KEY  — ed25519 private key whose public half is registered
  #                  on the AUR account that owns the `pikr-bin` package.
  #                  NOTE: AUR_SSH_KEY is org-level SELECTED-scope — it
  #                  must be explicitly granted to kryptic-sh/pikr or the
  #                  deploy step fails with a libcrypto error that
  #                  misdiagnoses missing access as a bad key. Grant it
  #                  in Settings → Secrets → AUR_SSH_KEY → Repository access.
  aur-bin:
    name: Publish pikr-bin to AUR
    needs: [build]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build deps
        run: |
          set -euo pipefail
          # base-devel pulls in makepkg + fakeroot. openssh + git for
          # the AUR push. curl fetches the sha256 sidecars off the
          # release without needing the GitHub CLI.
          pacman -Sy --noconfirm --needed base-devel git openssh curl

      - uses: actions/checkout@v6

      - name: Resolve version
        id: tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG (pkgver=$VERSION)"

      - name: Fetch tarball sha256 sidecars
        id: sha
        run: |
          set -euo pipefail
          V="${{ steps.tag.outputs.version }}"
          BASE="https://github.com/kryptic-sh/pikr/releases/download/v${V}"
          # The build matrix uploaded both arches before this job ran
          # (we `needs: [build]`), so the sidecars are guaranteed to exist.
          for arch in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            curl -fsSL "$BASE/pikr-v${V}-${arch}.tar.gz.sha256" -o "sha.${arch}"
          done
          # sidecar format: `<hash>  <filename>` — keep first column.
          echo "x86_64=$(awk '{print $1}' sha.x86_64-unknown-linux-gnu)" >> "$GITHUB_OUTPUT"
          echo "aarch64=$(awk '{print $1}' sha.aarch64-unknown-linux-gnu)" >> "$GITHUB_OUTPUT"

      - name: Render PKGBUILD
        run: |
          set -euo pipefail
          mkdir -p out
          sed \
            -e "s/{VERSION}/${{ steps.tag.outputs.version }}/g" \
            -e "s/{SHA256_X86_64}/${{ steps.sha.outputs.x86_64 }}/g" \
            -e "s/{SHA256_AARCH64}/${{ steps.sha.outputs.aarch64 }}/g" \
            pkg/aur/PKGBUILD-bin.in > out/PKGBUILD
          echo "--- rendered PKGBUILD ---"
          cat out/PKGBUILD

      - name: Generate .SRCINFO
        run: |
          set -euo pipefail
          # makepkg refuses to run as root. The archlinux:latest image's
          # `nobody` user has an expired password (`su: User account has
          # expired`), so we provision a fresh build user instead.
          useradd -m builder
          chown -R builder:builder out
          # `su` parses options BEFORE the username; anything after gets
          # passed to the shell. Put `-s` first so it's interpreted as
          # the shell flag, not stdin-mode for bash.
          su -s /bin/bash builder -c 'cd out && makepkg --printsrcinfo > .SRCINFO'
          echo "--- .SRCINFO ---"
          cat out/.SRCINFO

      - name: Configure SSH for AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur

      - name: Push to AUR
        # `GIT_SSH_COMMAND` injects ssh options inline so we don't depend
        # on `~/.ssh/config` parsing. `accept-new` writes the AUR host
        # key to known_hosts on first connect; subsequent connects
        # strict-verify.
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts"
        run: |
          set -euo pipefail
          git config --global user.name  "pikr-ci"
          git config --global user.email "ci@kryptic.sh"
          git clone ssh://aur@aur.archlinux.org/pikr-bin.git aur-repo
          cp out/PKGBUILD out/.SRCINFO aur-repo/
          cp pkg/aur/LICENSE pkg/aur/.gitignore aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO LICENSE .gitignore
          if git diff --cached --quiet; then
            echo "no changes vs current AUR head; nothing to push"
            exit 0
          fi
          git commit -m "pikr-bin ${{ steps.tag.outputs.version }}-1"
          git push origin master

  # Alpine .apk for `pikr`. Pulls the just-uploaded musl tarball off the
  # release, renders pkg/alpine/APKBUILD.in with version + sha512, builds
  # an unsigned package via abuild inside an alpine:latest container, and
  # uploads the .apk back to the same release. Lives here so it runs in
  # the same `needs: [build]` cascade as aur-bin.
  #
  # Gotchas (per kryptic-sh pattern):
  #   RFC822 maintainer field in APKBUILD.in — plain `Name <email>` format.
  #   Install throwaway pubkey to /etc/apk/keys BEFORE abuild signs the index.
  alpine:
    name: Build .apk for Alpine (x86_64)
    needs: [build]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    container: alpine:latest
    permissions:
      contents: write
    steps:
      - name: Install build deps
        run: |
          set -euo pipefail
          # alpine-sdk pulls in abuild + fakeroot + build-base. curl/bash
          # for the asset fetch + workflow scripting. coreutils for a
          # GNU-flavored sha512sum that accepts the same `awk '{print $1}'`
          # split we use elsewhere in this file.
          apk add --no-cache alpine-sdk bash curl coreutils

      - uses: actions/checkout@v6

      - name: Resolve version
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG (pkgver=$VERSION)"

      - name: Fetch musl tarball + compute sha512
        id: sha
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.tag.outputs.version }}"
          BASE="https://github.com/kryptic-sh/pikr/releases/download/v${V}"
          # Sidecars on the release are sha256; abuild wants sha512, so
          # re-hash the tarball locally rather than depending on a second
          # sidecar format.
          TARBALL="pikr-v${V}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$BASE/$TARBALL" -o "$TARBALL"
          SHA512=$(sha512sum "$TARBALL" | awk '{print $1}')
          echo "sha512=$SHA512" >> "$GITHUB_OUTPUT"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"

      - name: Render APKBUILD
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sed \
            -e "s|{VERSION}|${{ steps.tag.outputs.version }}|g" \
            -e "s|{SHA512_X86_64}|${{ steps.sha.outputs.sha512 }}|g" \
            pkg/alpine/APKBUILD.in > out/APKBUILD
          # abuild reads the source from $SRCDEST when present; drop the
          # already-downloaded tarball there so we don't refetch.
          mkdir -p out/src
          cp "${{ steps.sha.outputs.tarball }}" out/src/
          echo "--- rendered APKBUILD ---"
          cat out/APKBUILD

      - name: Build .apk
        shell: bash
        run: |
          set -euo pipefail
          # abuild refuses to run as root. Provision a build user with
          # abuild group membership so it can sign the package index.
          adduser -D builder
          addgroup builder abuild
          # /var/cache/distfiles is abuild's default SRCDEST; let the
          # builder user write there.
          mkdir -p /var/cache/distfiles
          chown builder:abuild /var/cache/distfiles
          chmod 775 /var/cache/distfiles
          chown -R builder:builder out
          # Generate a throwaway signing key. The .apk is published
          # unsigned-from-the-user's-POV (they `apk add --allow-untrusted`
          # the file), but abuild still wants a key to sign the index it
          # writes alongside.
          su builder -c 'abuild-keygen -a -n'
          # Install the throwaway pubkey to /etc/apk/keys BEFORE running
          # abuild — the index-signing step rejects packages whose pubkey
          # isn't present there. (Gotcha: install pubkey first.)
          cp /home/builder/.abuild/*.rsa.pub /etc/apk/keys/
          # -F: force build even though we're not in an aports tree.
          # -r: install missing build deps automatically.
          su builder -c 'cd out && SRCDEST=/var/cache/distfiles cp src/*.tar.gz /var/cache/distfiles/ && abuild -F -r'
          # Default PKGDEST is ~builder/packages/<pkgrepo>/<arch>/
          APK=$(find /home/builder/packages -name 'pikr-*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::no .apk produced"
            find /home/builder/packages -type f
            exit 1
          fi
          cp "$APK" .
          APK_NAME=$(basename "$APK")
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          echo "built: $APK_NAME"

      - name: Upload .apk + sha256
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pikr-*.apk
            pikr-*.apk.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Homebrew tap auto-publish for `pikr`. Pulls the just-uploaded macOS
  # tarball checksums off the release, renders pkg/homebrew/pikr.rb.in,
  # and pushes the formula to kryptic-sh/homebrew-tap over SSH. Mirrors
  # the aur-bin job shape; same `needs: [build]` cascade so the macOS
  # sidecars are guaranteed to exist by the time this runs.
  #
  # Required org/repo secret:
  #   BREW_SSH_KEY  — ed25519 private key whose public half is registered
  #                   as a deploy key (write access) on
  #                   kryptic-sh/homebrew-tap. Org-level SELECTED-scope —
  #                   already granted to this repo.
  brew-tap:
    name: Publish pikr formula to homebrew-tap
    needs: [build]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Resolve version
        id: tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release tag: $TAG (formula version=$VERSION)"

      - name: Fetch macOS sha256 sidecars
        id: sha
        run: |
          set -euo pipefail
          V="${{ steps.tag.outputs.version }}"
          BASE="https://github.com/kryptic-sh/pikr/releases/download/v${V}"
          for arch in aarch64-apple-darwin x86_64-apple-darwin; do
            curl -fsSL "$BASE/pikr-v${V}-${arch}.tar.gz.sha256" -o "sha.${arch}"
          done
          echo "aarch64=$(awk '{print $1}' sha.aarch64-apple-darwin)" >> "$GITHUB_OUTPUT"
          echo "x86_64=$(awk '{print $1}' sha.x86_64-apple-darwin)" >> "$GITHUB_OUTPUT"

      - name: Render formula
        run: |
          set -euo pipefail
          mkdir -p out
          sed \
            -e "s|{VERSION}|${{ steps.tag.outputs.version }}|g" \
            -e "s|{SHA256_AARCH64_DARWIN}|${{ steps.sha.outputs.aarch64 }}|g" \
            -e "s|{SHA256_X86_64_DARWIN}|${{ steps.sha.outputs.x86_64 }}|g" \
            pkg/homebrew/pikr.rb.in > out/pikr.rb
          echo "--- rendered formula ---"
          cat out/pikr.rb

      - name: Configure SSH for homebrew-tap
        env:
          BREW_SSH_KEY: ${{ secrets.BREW_SSH_KEY }}
        run: |
          set -euo pipefail
          install -dm700 ~/.ssh
          printf '%s\n' "$BREW_SSH_KEY" > ~/.ssh/brew
          chmod 600 ~/.ssh/brew

      - name: Push formula to homebrew-tap
        # Same SSH command shape as the AUR job — inline options so we
        # don't depend on ~/.ssh/config parsing. `accept-new` writes the
        # github.com host key to known_hosts on first connect.
        env:
          GIT_SSH_COMMAND: "ssh -i ~/.ssh/brew -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=~/.ssh/known_hosts"
        run: |
          set -euo pipefail
          git config --global user.name  "pikr-ci"
          git config --global user.email "ci@kryptic.sh"
          git clone git@github.com:kryptic-sh/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp out/pikr.rb tap/Formula/pikr.rb
          cd tap
          git add Formula/pikr.rb
          if git diff --cached --quiet; then
            echo "no changes vs current tap head; nothing to push"
            exit 0
          fi
          git commit -m "pikr ${{ steps.tag.outputs.version }}"
          git push origin HEAD:main

  # ── .deb + .rpm via nfpm ────────────────────────────────────────────────
  # Mirrors the alpine/aur/brew shape: gated on tag pushes, depends on
  # the per-target binary builds, renders a single nfpm.yaml manifest per
  # (format, arch) and uploads the resulting package + sha256 to the
  # GitHub release. nfpm drives both deb and rpm from the same config.
  # Issues #11 (.deb) and #12 (.rpm).
  nfpm:
    name: Package ${{ matrix.format }} (${{ matrix.arch.nfpm }})
    needs: [build]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        # nfpm's normalized arch name (amd64/arm64) + the upstream rust
        # target whose tarball we pull off the release. Output filename
        # is `pikr_<ver>_<deb-arch>.deb` for deb and
        # `pikr-<ver>-1.<rpm-arch>.rpm` for rpm — nfpm translates the arch.
        arch:
          - { nfpm: amd64, target: x86_64-unknown-linux-gnu }
          - { nfpm: arm64, target: aarch64-unknown-linux-gnu }
        format: [deb, rpm]
    steps:
      - uses: actions/checkout@v6

      - name: Install nfpm
        run: |
          set -euo pipefail
          NFPM_VERSION="2.41.0"
          curl -fsSL \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin nfpm
          nfpm --version

      - name: Resolve version
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Fetch binary tarball + extract
        shell: bash
        run: |
          set -euo pipefail
          V="${{ steps.tag.outputs.version }}"
          TARBALL="pikr-v${V}-${{ matrix.arch.target }}.tar.gz"
          BASE="https://github.com/kryptic-sh/pikr/releases/download/v${V}"
          curl -fsSL "$BASE/$TARBALL" -o "$TARBALL"
          tar xzf "$TARBALL"

      - name: Render nfpm config
        shell: bash
        run: |
          set -euo pipefail
          sed \
            -e "s|{VERSION}|${{ steps.tag.outputs.version }}|g" \
            -e "s|{ARCH}|${{ matrix.arch.nfpm }}|g" \
            pkg/nfpm/nfpm.yaml.in > nfpm.yaml
          echo "--- rendered nfpm.yaml ---"
          cat nfpm.yaml

      - name: Build package
        shell: bash
        run: |
          set -euo pipefail
          nfpm package --packager ${{ matrix.format }} --config nfpm.yaml --target .
          # Single artifact per invocation; capture its name for the sha256.
          PKG=$(ls pikr*.${{ matrix.format }} | head -1)
          if [ -z "$PKG" ]; then
            echo "::error::no .${{ matrix.format }} produced"
            exit 1
          fi
          sha256sum "$PKG" > "$PKG.sha256"
          echo "built: $PKG"

      - name: Upload package + sha256
        uses: softprops/action-gh-release@v3
        with:
          files: |
            pikr*.${{ matrix.format }}
            pikr*.${{ matrix.format }}.sha256
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
