[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
# Each entry is one advisory, with why it cannot be fixed here and what
# retires it.
ignore = [
    # `zbus_names`, `zvariant` and `zvariant_derive` are unmaintained because
    # zbus 6 absorbed them; informational, not vulnerabilities. They reach pikr
    # only through crcbl-shell's `accesskit` feature (`accesskit_unix`, the
    # AT-SPI adapter), whose newest release, 0.24, is still on zbus 5. Remove
    # all three when crcbl takes an `accesskit_unix` on zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant folded into zbus 6; accesskit_unix 0.24 is on zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names folded into zbus 6; accesskit_unix 0.24 is on zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive folded into zbus 6; accesskit_unix 0.24 is on zbus 5" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
