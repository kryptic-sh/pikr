[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # paste — pulled in transitively via floem / vello. No longer
    # maintained but the API surface is closed and the crate has no known
    # CVE. Tracked upstream; revisit when floem drops the dep.
    "RUSTSEC-2024-0436",
    # gtk-rs GTK3 bindings family — pulled transitively via
    # jrmoulton/understory (a floem main dep). Upstream gtk-rs deprecated
    # the GTK3 bindings in favour of GTK4. No CVE; revisit when the floem
    # tree moves off the GTK3 generation.
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # proc-macro-error — unmaintained, pulled transitively. No CVE.
    "RUSTSEC-2024-0370",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # Epic 4 — Wayland layer-shell support lives on forks of
    # lapce/floem and rust-windowing/winit until the patches land upstream.
    "https://github.com/mxaddict/floem.git",
    "https://github.com/mxaddict/winit.git",
    # Transitive deps of the current lapce/floem main that the
    # layer-shell-port branch tracks: vger-rs (Vello SDF renderer) and
    # jrmoulton/understory (box-tree / focus utilities).
    "https://github.com/lapce/vger-rs",
    "https://github.com/jrmoulton/understory",
]
