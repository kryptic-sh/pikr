      <stop offset="0" stop-color="#ff79c6"/>
      <stop offset="0.6" stop-color="#d4a3ff"/>
      <stop offset="1" stop-color="#ffd1ec"/>
    </linearGradient>
    <radialGradient id="bg1" cx="20%" cy="0%" r="50%">
